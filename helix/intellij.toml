# IntelliJ Helix Keymap Configuration
# Location: ~/.config/helix/intellij.toml
#
# Dedicated to IntelliJ Helix and safe from CLI Helix conflicts!
# You can freely bind native IDE actions via ':action <ActionId>'.

[keys.normal]
# Workaround for up and down not remembering vertical position
"j" = ":action EditorDown"
"k" = ":action EditorUp"

# Toggle all tool windows
"space"."W" = ":action HideAllWindows"

# Bookmarks, use F11 to toggle anonymous bookmark or Ctrl+F11 to create a mnemonic bookmark
"["."`" = ":action GotoPreviousBookmark"
"]"."`" = ":action GotoNextBookmark"
"space"."`" = ":action ShowBookmarks"

# Next usage, no reverse for now...
"#" = ":action GotoNextElementUnderCaretUsage"

# About gD in Helix plugin
# `gd` = :action GotoDefinition, to definition or find usages if on a definition
# `gD` = :action GotoDefinitionOnly, to definition ONLY (unused in stock Helix)
# Rebind to GotoDeclaration instead.
"g"."D" = ":action GotoSuperMethod"

[keys.select]
# Workaround for up and down not remembering vertical position
"j" = ":action EditorDownWithSelection"
"k" = ":action EditorUpWithSelection"
